name: Release (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [omelet]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx1536m" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret not set — release will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/omelet-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=omelet-release.jks"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build APKs and App Bundle (${{ matrix.flavor }})
        run: |
          B=${{ github.run_number }}
          flutter build apk --release --build-number=$B --flavor ${{ matrix.flavor }} --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --build-number=$B --split-per-abi --flavor ${{ matrix.flavor }} --obfuscate --split-debug-info=build/symbols
          flutter build appbundle --release --build-number=$B --flavor ${{ matrix.flavor }} --obfuscate --split-debug-info=build/symbols

      - name: Collect Android artifacts (${{ matrix.flavor }})
        run: |
          F=${{ matrix.flavor }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-$F-release.apk            dist/Omelet-android-$F-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-$F-release.apk  dist/Omelet-android-$F-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-$F-release.apk dist/Omelet-android-$F-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-$F-release.apk     dist/Omelet-android-$F-x86_64.apk
          cp build/app/outputs/bundle/${F}Release/app-$F-release.aab     dist/Omelet-android-$F.aab
          tar -czf dist/Omelet-android-$F-symbols.tar.gz -C build/symbols .

      - name: Upload Android artifacts (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute version
        id: ver
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=v${PUBSPEC_VERSION}+${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=Omelet ${PUBSPEC_VERSION} (сборка ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: ls -lhR dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Автоматическая сборка из ветки `${{ github.ref_name }}` @ `${{ github.sha }}`.

            ## Какой файл качать

            ### Android
            - **`Omelet-android-omelet-arm64-v8a.apk`** — рекомендуется для большинства современных телефонов (64-битный ARM).
            - `Omelet-android-omelet-universal.apk` — универсальный APK, работает везде, но весит больше.
            - `Omelet-android-omelet-armeabi-v7a.apk` — для старых 32-битных устройств.
            - `Omelet-android-omelet-x86_64.apk` — для эмуляторов и редких x86-устройств.
            - `Omelet-android-omelet.aab` — App Bundle для публикации в Google Play (не для ручной установки).

            Сборки для других платформ появятся позже.
          files: dist/*
